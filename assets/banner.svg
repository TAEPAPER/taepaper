<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .t{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
      .m{font-family:'JetBrains Mono','Consolas','Menlo',monospace}
      @keyframes grow{from{width:0}to{width:120px}}
      .bar{animation:grow 1.2s ease-out forwards}
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#0F172A"/>
  <text class="t" x="80" y="155" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1">TAEPAPER</text>
  <text class="t" x="82" y="200" font-size="18" font-weight="600" fill="#F97316" letter-spacing="3">FINDING MY TIPPING POINT</text>
  <rect class="bar" x="82" y="222" height="4" rx="2" width="120" fill="#F97316"/>
  <g class="m" font-size="20" fill="#94A3B8" text-anchor="end">
    <text x="1120" y="105">LLM / RAG</text>
    <text x="1120" y="140">MODEL SERVING</text>
    <text x="1120" y="175">INFRA</text>
    <text x="1120" y="210">BACKEND</text>
  </g>
  <rect x="1132" y="88" width="3" height="128" rx="1.5" fill="#334155"/>
</svg>
